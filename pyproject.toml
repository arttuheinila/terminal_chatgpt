[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "terminal-gpt"
version = "0.1.0"
description = "Terminal-first ChatGPT helper"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "python-dotenv",
]

[project.scripts]
tgpt = "main:main"

[tool.setuptools.packages.find]
include = ["tgpt*"]
exclude = ["notes*", "sessions*", "tests*"]